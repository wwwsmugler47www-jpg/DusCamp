<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUSCamp — Giriş</title><link rel="icon" type="image/svg+xml" href="/dentatest-favicon.svg"><link rel="apple-touch-icon" href="/dentatest-favicon.svg"><meta name="theme-color" content="#123f78"><link rel="stylesheet" href="/style.css?v=202"><style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb}.loginCard{width:min(440px,calc(100% - 32px));padding:42px 38px;border-radius:22px;box-shadow:0 12px 40px #17203318;border:1px solid #e8ebf2}.loginLogoWrap{text-align:center;margin-bottom:8px}.loginLogoImg{display:block;width:230px;height:74px;object-fit:contain;margin:0 auto}.loginSub{text-align:center;color:#687386;margin:8px 0 26px;line-height:1.45}.loginInput{width:100%;box-sizing:border-box;height:52px;padding:0 15px;border:1px solid #d9dee8;border-radius:12px;font-size:16px;background:#fff}.loginOtpBoxes{display:flex;justify-content:center;gap:9px;margin-bottom:4px}.loginOtpBox{width:48px;height:56px;box-sizing:border-box;border:1px solid #d9dee8;border-radius:12px;text-align:center;font-size:24px;font-weight:800;background:#fff;color:#172033;outline:none}.loginOtpBox:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.loginBtn{width:100%;height:52px;margin-top:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.loginBtn:disabled{opacity:.6}.loginTopBack{display:block;margin:0 0 14px;padding:0;border:0;background:transparent;color:#64748b;font-size:14px;font-weight:700;cursor:pointer;text-align:left}.loginTopBack:hover{text-decoration:underline}.loginBack{width:100%;margin-top:10px;border:0;background:transparent;color:#64748b;cursor:pointer}.loginMsg{min-height:24px;margin-top:14px;text-align:center;color:#64748b}.loginMsg.err{color:#dc2626}.loginNotice{display:flex;flex-direction:column;gap:5px;margin-top:10px;padding:11px 12px;border:1px solid #fde68a;border-radius:10px;background:#fffbeb;color:#854d0e;font-size:12px;line-height:1.4}.loginNotice b{font-size:13px;color:#713f12}.loginNotice strong{font-weight:800}.night .loginNotice{background:#422006;border-color:#92400e;color:#fed7aa}.night .loginNotice b{color:#fef3c7}.night .loginCard{background:#1e293b;color:#e5e7eb;border-color:#334155}.night .loginSub{color:#94a3b8}.night .loginInput{background:#0f172a;color:#e5e7eb;border-color:#475569}.night .loginBack{color:#94a3b8}@media(max-width:600px){.loginCard{padding:30px 20px}.loginLogoImg{width:200px;height:64px}.loginNotice{font-size:11px}.loginOtpBox{width:42px;height:52px;gap:5px}}</style></head><body><main class="card loginCard"><button class="loginTopBack" type="button" onclick="location.href='/'">← Geri</button><div class="loginLogoWrap"><img class="loginLogoImg" src="/dentatest-logo.svg" alt="DUSCamp"></div><p class="loginSub" id="sub">Hesabına giriş yapmak için e-posta adresini yaz.</p><form id="form"><input class="loginInput" id="email" type="email" autocomplete="username webauthn" placeholder="E-posta adresin" required><div id="codeWrap" hidden><div class="loginOtpBoxes" id="otpBoxes"><input class="loginOtpBox" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="1. hane"><input class="loginOtpBox" inputmode="numeric" maxlength="1" aria-label="2. hane"><input class="loginOtpBox" inputmode="numeric" maxlength="1" aria-label="3. hane"><input class="loginOtpBox" inputmode="numeric" maxlength="1" aria-label="4. hane"><input class="loginOtpBox" inputmode="numeric" maxlength="1" aria-label="5. hane"><input class="loginOtpBox" inputmode="numeric" maxlength="1" aria-label="6. hane"></div><input id="code" type="hidden" autocomplete="one-time-code"><div class="loginNotice"><b>📩 Kod e-postana gönderildi.</b><span>Gelen kutunda görünmüyorsa <strong>Spam / Gereksiz / Tanıtımlar</strong> klasörünü de kontrol et.</span></div></div><button class="loginBtn" id="submit">Devam Et</button><button class="loginBack" id="back" type="button" hidden>← E-posta adresini değiştir</button></form><div class="loginMsg" id="msg"></div></main><script>(async()=>{const A=window.hatchable.auth,f=document.getElementById("form"),e=document.getElementById("email"),c=document.getElementById("code"),w=document.getElementById("codeWrap"),b=document.getElementById("submit"),back=document.getElementById("back"),m=document.getElementById("msg"),s=document.getElementById("sub"),otp=[...document.querySelectorAll(".loginOtpBox")];let step="email";const syncOtp=()=>{c.value=otp.map(x=>x.value).join("");};otp.forEach((x,i)=>{x.addEventListener("input",()=>{x.value=x.value.replace(/\D/g,"").slice(-1);syncOtp();if(x.value&&i<otp.length-1)otp[i+1].focus()});x.addEventListener("keydown",ev=>{if(ev.key==="Backspace"&&!x.value&&i>0)otp[i-1].focus()});x.addEventListener("paste",ev=>{ev.preventDefault();const v=(ev.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);v.split("").forEach((d,j)=>{if(otp[i+j])otp[i+j].value=d});syncOtp();const last=Math.min(i+v.length,otp.length-1);otp[last].focus()})});const n=new URLSearchParams(location.search).get("next")||"/";const go=()=>location.replace(n.startsWith("/")&&!n.startsWith("//")?n:"/");if((await A.getSession()).user)return go();f.onsubmit=async x=>{x.preventDefault();b.disabled=true;m.textContent="";try{if(step==="email"){const r=await A.startLogin({email:e.value.trim()});if(r.has_passkey&&A.supportsPasskeys())try{const d=await A.signInWithPasskey({email:e.value.trim()});if(d&&d.user)return go()}catch(_){}step="code";w.hidden=false;back.hidden=false;b.textContent="Giriş Yap";s.textContent="Kod e-posta adresine gönderildi.";otp[0].focus()}else{syncOtp();if(c.value.length!==6)throw new Error("Lütfen 6 haneli doğrulama kodunu girin.");await A.verifyCode({email:e.value.trim(),code:c.value.trim()});go()}}catch(err){m.textContent=err.message||"İşlem başarısız.";m.className="loginMsg err"}finally{b.disabled=false}};back.onclick=()=>{step="email";w.hidden=true;back.hidden=true;otp.forEach(x=>x.value="");c.value="";b.textContent="Devam Et";s.textContent="Hesabına giriş yapmak için e-posta adresini yaz.";m.textContent="";e.focus()};e.focus()})()</script></body></html>
